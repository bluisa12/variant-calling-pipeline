# Pipeline settings. Change the region here to analyse a different part of the genome.

sample: HG003

# Small slice of chromosome 20 so the pipeline runs on a laptop in minutes.
chrom: chr20
region: "chr20:10000000-11000000"

reference: data/reference/chr20.fa
reads:
  r1: data/reads/HG003_R1.fastq.gz
  r2: data/reads/HG003_R2.fastq.gz

# GIAB v4.2.1 benchmark (known-correct variant calls) for scoring our results
truth_vcf: data/truth/HG003_truth.vcf.gz
truth_bed: data/truth/HG003_truth.bed

# Variant filters: calls below these get FILTER=LowQual (kept in the VCF, not deleted)
filters:
  min_qual: 20     # Phred-scaled call quality (20 = 1% chance the call is wrong)
  min_depth: 10    # reads covering the position

threads: 4

# Memory for RTG vcfeval (Java). 2g is plenty for this small region.
rtg_mem: 2g

# Optional AI steps (off by default, so the core pipeline needs no API key).
# The API key is NOT set here: it is read from the FREELLMAPI_API_KEY
# environment variable (see .env.example).
ai:
  enabled: false
  provider: freellmapi
  base_url: ""        # FreeLLMAPI endpoint, e.g. https://.../v1 (fill in from its docs)
  model: ""           # exact model name, e.g. a Gemini model; pinned for reproducibility
  temperature: 0      # 0 = as repeatable as the model allows
  max_tokens: 1024
  timeout_seconds: 60
